<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      padding: 16px;
    }
    h1 {
      font-size: 14px;
      font-weight: 600;
      color: #10a37f;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    h1 svg { flex-shrink: 0; }

    .desc {
      font-size: 11px;
      color: #888;
      line-height: 1.5;
      margin-bottom: 12px;
    }

    button {
      width: 100%;
      padding: 10px 16px;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      background: #10a37f;
    }
    button:hover { background: #0d8c6d; }
    button:active { background: #0a7a5e; }
    button:disabled {
      background: #333 !important;
      color: #666;
      cursor: not-allowed;
    }

    #status {
      margin-top: 10px;
      font-size: 12px;
      min-height: 18px;
      line-height: 1.5;
      white-space: pre-line;
    }
    .success { color: #10a37f; }
    .error { color: #ef4444; }
    .info { color: #999; }
    .stats {
      margin-top: 8px;
      font-size: 11px;
      color: #666;
      border-top: 1px solid #2a2a3e;
      padding-top: 8px;
    }
    .stats span { color: #10a37f; font-weight: 600; }
    .steps {
      margin-bottom: 12px;
      font-size: 11px;
      line-height: 1.7;
      color: #aaa;
    }
    .steps b { color: #ccc; }
    .step { padding: 2px 0; }
  </style>
</head>
<body>
  <h1>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#10a37f" stroke-width="2">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
      <polyline points="14 2 14 8 20 8"/>
      <line x1="16" y1="13" x2="8" y2="13"/>
      <line x1="16" y1="17" x2="8" y2="17"/>
      <polyline points="10 9 9 9 8 9"/>
    </svg>
    Deep Research → Markdown
  </h1>

  <div class="desc">On a Deep Research report page, first click ChatGPT's <b style="color:#ccc">Copy</b> button to copy the official Markdown, then click the button below to merge citation sources.</div>

  <div class="steps">
    <div class="step">❶ Expand report → Open Sources sidebar → Click ChatGPT's <b>Copy</b></div>
    <div class="step">❷ Click the button below ↓</div>
  </div>

  <button id="copyBtn">Merge Citations to Clipboard</button>

  <div id="status"></div>
  <div id="stats" class="stats" style="display:none;"></div>
  <script src="popup.js"></script>
</body>
</html>
